name: Release

# Maakt een GitHub-release zodra er een nieuwe versie in de repo staat.
# - Push naar main: release v<versie> (pre-release als de versie een streepje heeft, zoals 3.4.0-beta.1).
# - Proefversie vanaf een andere branch alleen na een handmatige stap: de knop
#   "Run workflow" (workflow_dispatch) op die branch, of een push naar een
#   claude/-branch waarvan het laatste commitbericht [proef] bevat.
# - Bestaat de tag al, dan gebeurt er niets.
# Voor de release: dezelfde controles als bij een pull request (bouw/controle.sh).
# Het pakket is sfp-page-config.zip (bouw/pakket.sh): zonder tests/, .github/ en bouw/,
# met de map sfp-page-config/. Het controlegetal (SHA-256) staat als laatste regel
# in de releasetekst en als bestand sfp-page-config.zip.sha256; de updater op de
# sites installeert alleen dat pakket en alleen als het controlegetal klopt.
# De tekst van de release is het blok "## [<versie>]" uit CHANGELOG.md; ontbreekt dat blok, dan faalt de run.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - '*.php'
      - 'CHANGELOG.md'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Handmatige stap voor proefversies vanaf een branch
        id: poort
        shell: bash
        env:
          BERICHT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          door=true
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            case "$BERICHT" in *"[proef]"*) ;; *) door=false; echo "Push naar $GITHUB_REF_NAME zonder [proef] in het commitbericht: geen release." ;; esac
          fi
          echo "door=$door" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        if: steps.poort.outputs.door == 'true'
        with:
          php-version: '8.1'
          coverage: none
      - uses: actions/setup-node@v4
        if: steps.poort.outputs.door == 'true'
        with:
          node-version: '20'

      - name: Versie lezen en controleren
        if: steps.poort.outputs.door == 'true'
        id: versie
        shell: bash
        run: |
          set -euo pipefail
          hoofd=$(grep -lE '^[[:space:]]*\*?[[:space:]]*Plugin Name:' ./*.php | head -n1 || true)
          if [ -z "$hoofd" ]; then echo "::error::Geen hoofdbestand met 'Plugin Name:' gevonden"; exit 1; fi
          kop=$(grep -m1 -E '^[[:space:]]*\*?[[:space:]]*Version:' "$hoofd" | sed -E 's/.*Version:[[:space:]]*//; s/[[:space:]]*$//')
          const=$(grep -m1 -E "define\([[:space:]]*'[A-Z_]+_VERSION'" "$hoofd" | sed -E "s/.*_VERSION'[[:space:]]*,[[:space:]]*'([^']+)'.*/\1/" || true)
          if [ -z "$kop" ]; then echo "::error::Geen Version: in $hoofd"; exit 1; fi
          if [ -n "$const" ] && [ "$kop" != "$const" ]; then
            echo "::error::Versie in de kop ($kop) wijkt af van de constante ($const) in $hoofd"; exit 1
          fi
          if ! printf '%s' "$kop" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Ongeldig versienummer: $kop"; exit 1
          fi
          proef=false
          case "$kop" in *-*) proef=true ;; esac
          echo "versie=$kop" >> "$GITHUB_OUTPUT"
          echo "proef=$proef" >> "$GITHUB_OUTPUT"
          echo "Hoofdbestand $hoofd, versie $kop, proefversie $proef"

      - name: Bepalen of er een release moet komen
        if: steps.poort.outputs.door == 'true'
        id: besluit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIE: ${{ steps.versie.outputs.versie }}
          PROEF: ${{ steps.versie.outputs.proef }}
        run: |
          set -euo pipefail
          maken=true
          if [ "$GITHUB_REF_NAME" != "main" ] && [ "$PROEF" != "true" ]; then
            echo "Branch $GITHUB_REF_NAME met definitieve versie $VERSIE: geen release (die komt pas bij main)."
            maken=false
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSIE" >/dev/null 2>&1; then
            echo "Tag v$VERSIE bestaat al: niets te doen."
            maken=false
          fi
          echo "maken=$maken" >> "$GITHUB_OUTPUT"

      - name: Controles
        if: steps.besluit.outputs.maken == 'true'
        run: bash bouw/controle.sh

      - name: Pakket bouwen
        if: steps.besluit.outputs.maken == 'true'
        id: pakket
        shell: bash
        run: |
          set -euo pipefail
          som=$(bash bouw/pakket.sh dist | tail -n1)
          echo "som=$som" >> "$GITHUB_OUTPUT"
          unzip -l dist/sfp-page-config.zip | tail -n1

      - name: Releasetekst uit CHANGELOG.md
        if: steps.besluit.outputs.maken == 'true'
        shell: bash
        env:
          VERSIE: ${{ steps.versie.outputs.versie }}
        run: |
          set -euo pipefail
          awk -v v="$VERSIE" '
            index($0, "## [" v "]") == 1 { bezig = 1; next }
            bezig && /^## \[/ { exit }
            bezig { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::Geen blok '## [$VERSIE]' met tekst in CHANGELOG.md"; exit 1
          fi
          printf '\nSHA-256 sfp-page-config.zip: %s\n' "${{ steps.pakket.outputs.som }}" >> notes.md
          cat notes.md

      - name: Release publiceren
        if: steps.besluit.outputs.maken == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIE: ${{ steps.versie.outputs.versie }}
          PROEF: ${{ steps.versie.outputs.proef }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$PROEF" = "true" ]; then extra+=(--prerelease --latest=false); fi
          gh release create "v$VERSIE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSIE" \
            --notes-file notes.md \
            "${extra[@]}" \
            dist/sfp-page-config.zip dist/sfp-page-config.zip.sha256
          echo "Gepubliceerd: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSIE"
