name: Controle

# Bij elke pull request en elke push naar main: php -l, node --check en de losse tests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Controles
        run: bash bouw/controle.sh
